# Included inside the existing server block; keep its VPN source allowlist.
location = /mcp {
    auth_basic off;
    limit_req zone=homework5_requests burst=10 nodelay;
    limit_req_status 429;
    limit_conn homework5_connections 4;
    limit_conn_status 429;
    client_max_body_size 16k;
    proxy_pass http://unix:/run/homework5-docs.sock;
    proxy_http_version 1.1;
    proxy_set_header Host mcp1.leadcm.com;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
    access_log off;
}
