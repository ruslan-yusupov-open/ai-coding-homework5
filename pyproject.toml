[project]
name = "homework5-docs-mcp"
version = "0.1.0"
description = "Local documentation MCP server for VS Code Copilot"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "starlette==1.6.0", "uvicorn==0.52.4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
